name: release

# On every push to main, publishes the next GitHub Release (and its vX.Y.Z tag) when
# changes/ gained fragments since the last tag. Nothing is committed back to main: the
# version lives only in the tag, computed by scripts/next-release.py (docs/releasing.md).
# workflow_dispatch re-runs the same computation on main, e.g. after a failed run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is computed from the tags and the fragments added since the last one.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release if fragments were added since the last tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/next-release.py --notes-file "$RUNNER_TEMP/notes.md")"
          if [ -z "$VERSION" ]; then
            echo "No fragments added since the last tag — nothing to release."
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
