name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests and skill/agent frontmatter
        run: python3 scripts/validate-plugin.py
      - name: Run bridge and packaging tests
        run: python3 -m unittest discover -s tests -v
