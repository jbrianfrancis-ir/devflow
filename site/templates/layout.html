<script>
for (const box of document.querySelectorAll("[data-copy]")) {
  const btn = box.querySelector(".copy"), pre = box.querySelector("pre");
  if (!btn || !pre || !navigator.clipboard) continue;
  btn.hidden = false;
  btn.addEventListener("click", () => navigator.clipboard.writeText(pre.textContent).then(
    () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy"; }, 2000); },
    () => { btn.textContent = "Select to copy"; }));
}
</script>
</body>
